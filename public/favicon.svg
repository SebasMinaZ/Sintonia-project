<!-- Emblema de Marca. Un SVG suelto no puede usar variables CSS: los colores son
     los valores de los tokens de src/styles/tokens.css (modo oscuro):
     #c6f24e = marca-primario · #10130a = texto-sobre-marca -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#c6f24e" />
  <!-- En Marca las ondas miden 28px dentro del círculo de 32px -->
  <path
    transform="translate(2 2) scale(0.875)"
    d="M8 13v7m5-12v17m6-14v11m5-8v5"
    fill="none"
    stroke="#10130a"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
